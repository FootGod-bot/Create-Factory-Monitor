plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
    id 'org.zaproxy.crowdin' version '0.6.0'
}

crowdin {
    credentials {
        token = providers.gradleProperty("crowdin.token")
    }

    configuration {
        file = file("crowdin.yml")
    }
}

tasks.named('crowdinCopyProjectTranslations') {
    dependsOn 'crowdinDownloadProjectTranslation'
}

def factoryMonitorLangDir =
        layout.projectDirectory.dir(
                'src/main/resources/assets/factorymonitor/lang'
        )

tasks.register('pullLang') {
    group = 'localization'
    description = 'Downloads and installs the latest language files from Crowdin.'

    dependsOn 'crowdinCopyProjectTranslations'

    doLast {
        def langDir = factoryMonitorLangDir.asFile

        langDir.listFiles()?.each { file ->
            if (file.isFile() && file.name.startsWith('en_us_')) {
                def newName = file.name.substring('en_us_'.length())
                def newFile = new File(langDir, newName)

                if (newFile.exists()) {
                    newFile.delete()
                }

                if (file.renameTo(newFile)) {
                    println "Renamed ${file.name} -> ${newFile.name}"
                }
            }
        }
    }
}

tasks.register('pushLang') {
    group = 'localization'
    description = 'Uploads the latest language files to Crowdin.'

    dependsOn 'crowdinUploadSourceFiles'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("src/generated/**/.cache")
}

repositories {
    maven {
        url = "https://maven.createmod.net"
    }
}

    dependencies {
        implementation("com.simibubi.create:create-1.21.1:${create_version}") {
            transitive = false
        }

        implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}") {
            transitive = false
        }
    }


base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' 
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
