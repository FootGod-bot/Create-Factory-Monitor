plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'

    id 'org.zaproxy.crowdin' version '0.6.0'
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
}

crowdin {
    credentials {
        token = providers.gradleProperty("crowdin.token")
    }

    configuration {
        file = file("crowdin.yml")
    }
}

tasks.named('crowdinCopyProjectTranslations') {
    dependsOn 'crowdinDownloadProjectTranslation'
}

def factoryMonitorLangDir =
        layout.projectDirectory.dir(
                'src/main/resources/assets/factorymonitor/lang'
        )

tasks.register('pullLang') {
    group = 'localization'
    description = 'Downloads and installs the latest language files from Crowdin.'

    dependsOn 'crowdinCopyProjectTranslations'

    doLast {
        def langDir = factoryMonitorLangDir.asFile

        langDir.listFiles()?.each { file ->
            if (file.isFile() && file.name.startsWith('en_us_')) {
                def newName = file.name.substring('en_us_'.length())
                def newFile = new File(langDir, newName)

                if (newFile.exists()) {
                    newFile.delete()
                }

                if (file.renameTo(newFile)) {
                    println "Renamed ${file.name} -> ${newFile.name}"
                }
            }
        }
    }
}

tasks.register('pushLang') {
    group = 'localization'
    description = 'Uploads the latest language files to Crowdin.'

    dependsOn 'crowdinUploadSourceFiles'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("src/generated/**/.cache")
}

repositories {
    maven {
        url = "https://maven.createmod.net"
    }
}

    dependencies {
        implementation("com.simibubi.create:create-1.21.1:${create_version}") {
            transitive = false
        }

        implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}") {
            transitive = false
        }
    }


base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' 
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
// ========================================
// Release Publishing
// ========================================

// ----------------------------------------
// Tokens
// ----------------------------------------

def cfToken = providers.gradleProperty('cfToken')
        .orElse(providers.environmentVariable('CURSEFORGE_TOKEN'))

def modToken = providers.gradleProperty('modToken')
        .orElse(providers.environmentVariable('MODRINTH_TOKEN'))

def githubToken = providers.gradleProperty('githubToken')
        .orElse(providers.environmentVariable('GITHUB_TOKEN'))

// ----------------------------------------
// Release configuration
// ----------------------------------------

def releaseEnvironment = providers.gradleProperty('release_environment')
        .orElse('both')
        .get()

def releaseLoader = providers.gradleProperty('release_loader')
        .orElse('neoforge')
        .get()

def releaseDisplayName = providers.gradleProperty('release_display_name')
        .orElse('${mod_id}-${minecraft_version}-${loader}')
        .get()
        .replace('${mod_id}', mod_id.toString())
        .replace('${mod_name}', mod_name.toString())
        .replace('${mod_version}', mod_version.toString())
        .replace('${minecraft_version}', minecraft_version.toString())
        .replace('${loader}', releaseLoader)

// ----------------------------------------
// JAR filename
// ----------------------------------------

tasks.jar {
    archiveFileName = "${releaseDisplayName}.jar"
}

// ----------------------------------------
// Changelog
// ----------------------------------------

def releaseChangelogFile = file("versions/${mod_version}/changelog.md")

if (!releaseChangelogFile.exists()) {
    releaseChangelogFile.parentFile.mkdirs()
    releaseChangelogFile.text = "Automatic Release"

    println("Created changelog: ${releaseChangelogFile}")
}

def releaseChangelog = releaseChangelogFile
        .getText("UTF-8")
        .trim()

if (releaseChangelog.isEmpty()) {
    releaseChangelog = "Automatic Release"
}

// ----------------------------------------
// Publishing
// ----------------------------------------

publishMods {
    file = tasks.jar.archiveFile

    changelog = releaseChangelog

    type = STABLE

    version = "${mod_version}+mc${minecraft_version}"

    displayName = releaseDisplayName

    modLoaders.add(releaseLoader)

    // ----------------------------------------
    // CurseForge
    // ----------------------------------------

    curseforge {
        accessToken = cfToken
        projectId = "1721347"
        minecraftVersions.add(minecraft_version)

        clientRequired = releaseEnvironment == "client" ||
                releaseEnvironment == "both"

        serverRequired = releaseEnvironment == "server" ||
                releaseEnvironment == "both"
    }

    // ----------------------------------------
    // Modrinth
    // ----------------------------------------

    modrinth {
        accessToken = modToken
        projectId = "iuCAyZjV"
        minecraftVersions.add(minecraft_version)

        environment = releaseEnvironment == "client"
                ? CLIENT_ONLY
                : releaseEnvironment == "server"
                ? SERVER_ONLY
                : CLIENT_AND_SERVER
    }

    // ----------------------------------------
    // GitHub
    // ----------------------------------------

    github {
        accessToken = githubToken
        repository = "FootGod-bot/Create-Factory-Monitor"

        commitish = "Main"

        tagName = "V${mod_version}"
    }
}