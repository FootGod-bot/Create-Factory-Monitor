name: Release to Modrinth

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read mod version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2- | tr -d '\r')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build

      - name: Find JAR
        id: jar
        shell: bash
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-dev.jar' \
            | head -n 1)

          if [ -z "$JAR" ]; then
            echo "No mod JAR found!"
            exit 1
          fi

          echo "jar=$JAR" >> "$GITHUB_OUTPUT"

      - name: Get Future Date (1 Year Ahead)
        id: date
        shell: bash
        run: |
          # Generates an ISO 8601 timestamp exactly 1 year from now
          FUTURE_DATE=$(date -u -d "+1 year" +"%Y-%m-%dT%H:%M:%SZ")
          echo "future_date=$FUTURE_DATE" >> "$GITHUB_OUTPUT"
          echo "Scheduled for: $FUTURE_DATE"

      - name: Publish to Modrinth (Scheduled)
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: ${{ secrets.MODRINTH_PROJECT_ID }}
          version: ${{ steps.version.outputs.version }}
          name: "Release ${{ steps.version.outputs.version }}"
          files: ${{ steps.jar.outputs.jar }}
          loaders: |
            neoforge
          game-versions: |
            1.21.1
          visibility: scheduled
          featured: false
          # Sets release date 1 year into the future
          date-published: ${{ steps.date.outputs.future_date }}
