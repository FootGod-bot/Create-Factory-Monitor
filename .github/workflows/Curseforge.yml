name: Build & Release On CurseForge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Find JAR
        id: jar
        shell: bash
        run: |
          JAR=$(find build/libs -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-dev.jar' \
            | head -n 1)
            
          if [ -z "$JAR" ]; then
            echo "No JAR found in build/libs"
            exit 1
          fi
            
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "Found JAR: $JAR"

      - name: Read mod version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
           
          if [ -z "$VERSION" ]; then
            echo "Could not find mod_version in gradle.properties"
            exit 1
          fi
            
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Upload to CurseForge as manual release
        shell: bash
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          JAR: ${{ steps.jar.outputs.jar }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          METADATA=$(jq -cn \
            --arg version "$VERSION" \
            '{
              changelog: "Automated release.",
              displayName: $version,
              gameVersionNames: ["1.21.1", "NeoForge"],
              releaseType: "release",
              isMarkedForManualRelease: true
            }')

          echo "Uploading $JAR to CurseForge..."
          echo "Metadata: $METADATA"

          curl --fail-with-body -sS \
            -X POST \
            "https://minecraft.curseforge.com/api/projects/$CURSEFORGE_PROJECT_ID/upload-file" \
            -H "X-Api-Token: $CURSEFORGE_API_TOKEN" \
            -F "metadata=$METADATA" \
            -F "file=@$JAR"

          echo "CurseForge file uploaded."
          echo "It is marked for manual release."
          echo "It will NOT automatically become public."

          echo "CurseForge file uploaded."
          echo "It is marked for manual release."
          echo "It will NOT automatically become public."
