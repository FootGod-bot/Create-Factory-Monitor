name: Release to CurseForge

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Find JAR
        id: jar
        shell: bash
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-dev.jar' \
            | head -n 1)

          if [ -z "$JAR" ]; then
            echo "No mod JAR found!"
            exit 1
          fi

          echo "jar=$JAR" >> "$GITHUB_OUTPUT"

      - name: Read mod version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2- | tr -d '\r')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish to CurseForge
        env:
          CF_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          JAR_PATH: ${{ steps.jar.outputs.jar }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          echo "Uploading $JAR_PATH to CurseForge project $PROJECT_ID..."
          
          # Metadata configuration for CurseForge API
          # Adjust game versions and loaders to match your project
          METADATA='{
            "changelog": "Release version $VERSION",
            "changelogType": "text",
            "releaseType": "release",
            "gameVersions": [1.21.1], 
            "loaders": ["neoforge"]
          }'

          response=$(curl -s -X POST \
            -H "X-Api-Token: $CF_API_TOKEN" \
            -F "metadata=$METADATA;type=application/json" \
            -F "file=@$JAR_PATH" \
            "https://minecraft.curseforge.com/api/projects/$PROJECT_ID/upload-file")

          echo "Response: $response"
          
          # Simple check to see if the upload was successful
          if echo "$response" | grep -q "id"; then
            echo "Successfully uploaded to CurseForge!"
          else
            echo "Failed to upload to CurseForge."
            exit 1
          fi
