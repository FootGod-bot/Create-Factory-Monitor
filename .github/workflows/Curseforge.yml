name: Release to CurseForge

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Find JAR
        id: jar
        shell: bash
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-dev.jar' \
            | head -n 1)

          if [ -z "$JAR" ]; then
            echo "No mod JAR found!"
            exit 1
          fi

          echo "jar=$JAR" >> "$GITHUB_OUTPUT"

      - name: Read mod version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2- | tr -d '\r')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish to CurseForge (Hidden)
        env:
          CF_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          JAR_PATH: ${{ steps.jar.outputs.jar }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          echo "Fetching version IDs from CurseForge API..."
          
          # Fetch all versions from CurseForge API
          VERSIONS_JSON=$(curl -s -H "X-Api-Token: $CF_API_TOKEN" "https://minecraft.curseforge.com/api/game/versions")
          
          # Safely parse the exact ID for Minecraft 1.21.1 and NeoForge
          MC_VERSION_ID=$(echo "$VERSIONS_JSON" | jq '[.[] | select(.name == "1.21.1")] | .[0].id')
          LOADER_VERSION_ID=$(echo "$VERSIONS_JSON" | jq '[.[] | select(.name == "NeoForge")] | .[0].id')

          echo "Found Minecraft 1.21.1 ID: $MC_VERSION_ID"
          echo "Found NeoForge ID: $LOADER_VERSION_ID"

          if [ "$MC_VERSION_ID" == "null" ] || [ "$LOADER_VERSION_ID" == "null" ]; then
            echo "Error: Could not resolve version IDs from CurseForge API."
            exit 1
          fi

          # Construct metadata with isMarkedForManualRelease: true to keep it hidden/unpublished
          METADATA=$(jq -n \
            --arg changelog "Release version $VERSION" \
            --argjson mc "$MC_VERSION_ID" \
            --argjson loader "$LOADER_VERSION_ID" \
            '{
              changelog: $changelog,
              changelogType: "text",
              releaseType: "release",
              gameVersions: [$mc, $loader],
              loaders: ["neoforge"],
              isMarkedForManualRelease: true
            }')

          echo "Uploading $JAR_PATH to CurseForge project $PROJECT_ID as hidden..."

          response=$(curl -s -X POST \
            -H "X-Api-Token: $CF_API_TOKEN" \
            -F "metadata=$METADATA;type=application/json" \
            -F "file=@$JAR_PATH" \
            "https://minecraft.curseforge.com/api/projects/$PROJECT_ID/upload-file")

          echo "Response: $response"
          
          if echo "$response" | grep -q "id"; then
            echo "Successfully uploaded to CurseForge as a hidden manual release!"
          else
            echo "Failed to upload to CurseForge."
            exit 1
          fi
