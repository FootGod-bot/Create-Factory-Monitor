org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.252
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)
create_version=6.0.10-281
ponder_version=1.0.82+mc1.21.1

mod_id=factorymonitor
mod_name=Create: Factory Monitor
mod_license=All Rights Reserved
mod_version=1.21.1.1
mod_group_id=com.footgod.factorymonitor

# Release settings
release_environment=both
release_loader=neoforge
release_display_name=${mod_id}-${minecraft_version}-${loader}

# Publishing destinations
release_curseforge_project_id=YOUR_CURSEFORGE_PROJECT_ID
release_modrinth_project_id=YOUR_MODRINTH_PROJECT_ID
release_github_repository=YOUR_GITHUB_USERNAME/YOUR_REPOSITORY
release_github_branch=Main

# Release details
release_tag_prefix=V